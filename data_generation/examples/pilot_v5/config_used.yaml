run_name: pilot_v5
seed: 13
output_dir: runs
generator:
  backend: groq
  model: openai/gpt-oss-120b
  extra_params:
    reasoning_effort: medium
  temperature: 0.9
  variants_per_call: 5
  retries: 2
  max_tokens: 3500
  tokens_per_minute: 3500
  max_workers: 4
judge:
  backend: groq
  model: qwen/qwen3.8-27b
  extra_params:
    reasoning_effort: none
  retries: 1
  max_workers: 2
  min_confidence: 0.5
  require_realistic: true
  soft_confusions:
  - - PV
    - FF
  accept_soft_agree: true
  turns: attack_turns
  repair_rounds: 2
single_turn:
  domains:
  - electronics
  - pharmaceuticals
  - fashion
  - financial_products
  - groceries
  techniques: all
  severity_mix:
    2: 0.5
    3: 0.5
  attack_target: 50
  overgenerate: 1.4
  matched_negatives: true
  negative_framing_match_rate: 0.8
  boundary_ratio: 0.25
  keep_orphans: false
exemplars_path: seeds/exemplars.jsonl
organic:
  bitext_csv: null
  twitter_csv: null
  limit: 500
quality:
  min_chars: 15
  max_chars: 700
  dedup_threshold: 0.8
splits:
  ratios:
    train: 0.7
    val: 0.1
    test: 0.2
  holdouts:
  - field: domain
    value: groceries
  - field: technique
    value: instruction_injection
  - field: attack_type
    value: competitor_extraction
multi_turn:
  enabled: false
  n_conversations: 1100
  pattern_mix:
    linear: 0.4
    camouflaged: 0.3
    late_spike: 0.3
  turn_range:
  - 3
  - 7
