# EcomSafeBench - Threat Class 1 (single-turn commercial jailbreaks)
run_name: single_turn_v1
seed: 13
output_dir: runs

generator:
  backend: groq
  model: openai/gpt-oss-120b
  extra_params: { reasoning_effort: medium } # GPT-OSS reasons first; low keeps it short
  temperature: 0.9
  variants_per_call: 5
  retries: 2
  max_tokens: 3500
  tokens_per_minute: 3500
  max_workers: 4

judge: # Use a DIFFERENT model family from the generator to avoid self-agreement bias.
  backend: groq
  model: qwen/qwen3.8-27b
  extra_params: {reasoning_effort: none}   # Qwen3 "thinks" by default; off keeps answers short and parseable
  retries: 1
  max_workers: 2
  min_confidence: 0.5
  require_realistic: true
  soft_confusions: [[PV, FF]]
  accept_soft_agree: true
  turns: attack_turns
  repair_rounds: 2
  requests_per_minute: 4 # misspelled "request_per_minute" in pilot_150 (silently ignored, so that run used the Groq default of 30)
single_turn:
  domains:
    [electronics, pharmaceuticals, fashion, financial_products, groceries]
  techniques: all # or a list, see taxonomy.TECHNIQUES
  severity_mix: { 2: 0.5, 3: 0.5 }
  attack_target: 1000 # attacks kept after QC (trimmed stratified)
  overgenerate: 1.4 # headroom for QC losses
  matched_negatives: true # one legit counterpart per attack, same product/policy topic
  negative_framing_match_rate: 0.8 # share of negatives that reuse the attack's framing benignly
  boundary_ratio: 0.25 # legit-but-close-to-the-line cases, relative to attack_target
  keep_orphans: false # drop an attack whose negative failed QC (and vice versa)

exemplars_path: seeds/exemplars.jsonl

organic: # real benign customer-service text (download separately)
  bitext_csv: null # e.g. data/bitext_customer_support.csv
  twitter_csv: null # e.g. data/twcs.csv
  limit: 500

quality:
  min_chars: 15
  max_chars: 700
  dedup_threshold: 0.8 # Jaccard on char 5-grams

splits:
  ratios: { train: 0.7, val: 0.1, test: 0.2 }
  holdouts: # generalization splits for RQ4
    - { field: domain, value: groceries }
    - { field: technique, value: instruction_injection }
    - { field: attack_type, value: competitor_extraction }

multi_turn: # Threat Class 2 - next stage
  enabled: false
  n_conversations: 1100
  pattern_mix: { linear: 0.4, camouflaged: 0.3, late_spike: 0.3 }
  turn_range: [3, 7]
